# Refresh the Trader Joe's catalog from Open Food Facts on the 1st of each month (or on demand), then redeploy.
# The script refuses to write a catalog that is smaller than 80% of the current one.
name: Grocery catalog

on:
  schedule:
    - cron: '0 11 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-catalog.mjs
      - name: Commit data
        id: commit
        run: |
          git config user.name "brooklyn-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/catalog.json public/data/catalog.meta.json state/catalog-report.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Catalog $(date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: build-catalog
    if: needs.build-catalog.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
