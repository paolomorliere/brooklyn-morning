# Build the app and publish it to GitHub Pages.
# Runs on every push to main and when called by the edition/catalog workflows after they commit new data.
# Zero cost: GitHub Actions and Pages are free for public repositories.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          # Project sites live at https://<user>.github.io/<repo>/ ; a repo named <user>.github.io lives at the root.
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then export BASE_PATH="/"; else export BASE_PATH="/$REPO_NAME/"; fi
          echo "BASE_PATH=$BASE_PATH"
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
