# Prepare the morning edition so it is ready before 6:00 AM New York time.
#
# GitHub starts scheduled workflows late on this repository, and the delay is the whole design problem.
# Measured again on 2026-11-12 over the eight preceding days, with `created_at` and `run_started_at`
# compared on every scheduled run of this workflow, of the stocks workflow and of the water polo one:
#
#   * There is **no queue delay at all** - `created_at` equals `run_started_at` to the second, always.
#     The lateness is GitHub deciding when to fire the cron, not a runner waiting to be free.
#   * **Each cron *expression* delivers about one run a day**, not each listed hour. Four expressions
#     gave exactly four runs a day, every day. (The earlier bet recorded in STATUS.md - spread the same
#     number of requests over more expressions - is what took this workflow from two runs a day to four.)
#   * **That one run arrives six to eight and a half hours after the expression's first requested time.**
#     `7 4,5` (04:07 UTC) landed between 10:58 and 12:46 UTC on eight consecutive days. Water polo's
#     Monday `0 2,3` (02:00 UTC) landed at 09:17 and 09:35. The lag is remarkably consistent.
#
# So the earliest requested slot that can legally build - 04:07 UTC, just after New York midnight in EST -
# cannot land before about 06:00 New York, and usually lands between 06:30 and 07:45. On 2026-11-12 it
# landed at 07:33 NY, and Paolo looked at 07:35 and reasonably thought it had failed.
#
# **The fix is that a cron is a lottery ticket bought seven hours in advance, and the ticket may be bought
# before midnight even though the edition must not be built before midnight.** The two expressions added
# below request at 22:29/23:29 and 01:51/02:51 UTC, which with the measured lag land roughly between
# 23:30 and 05:30 New York. `edition-needed.mjs` makes this safe without any change: it builds only when
# the newest edition's date differs from the *current* New York date, so a run that lands before midnight
# sees today's edition already there and skips in about ten seconds. A run that lands after midnight
# builds. Nothing can produce an edition dated for the wrong day.
#
# A build landing at, say, 03:00 New York is then refreshed in place by a later slot inside the 04:00-09:00
# window, so the stories are current by the time Paolo reads. Worst case he gets an edition a few hours
# old instead of no edition at all.
#
# **No arrangement of crons can guarantee a 6 AM edition**, because the delay is GitHub's and is not
# contractual. A hard guarantee needs a trigger from outside GitHub - a `launchd` job on Paolo's Mac, or
# an iPhone Shortcuts automation, calling `workflow_dispatch`. Both are free; neither is set up, and
# STATUS.md records that.
#
# Two further things cover the gap: the `workflow_run` triggers below, which give the edition a free
# attempt whenever another data workflow finishes, and the "Run it now" link the Morning screen shows
# when the edition is stale.
#
# A dependency-free pre-check makes every run that has nothing to do cost one checkout, about ten seconds.
#
#   no edition for today's NY date        -> build it, commit, deploy
#   today's edition older than 2.5 h and  -> refresh it in place (same date, same stock pick and quote,
#     it is between 04:00 and 09:00 NY       latest stories), commit, deploy
#   otherwise                             -> skip
name: Morning edition

on:
  schedule:
    # Bought before New York midnight, expected to land between about 23:30 and 02:30 New York. A run that
    # lands before midnight skips in ten seconds; one that lands after it builds the new day's edition.
    - cron: '29 22,23 * * *'
    # Expected to land between about 02:50 and 05:50 New York. This is the slot meant to put a complete
    # edition on the phone before Paolo wakes up.
    - cron: '51 1,2 * * *'
    # Just after New York midnight — 04:xx UTC in EDT, 05:xx in EST. Lands 06:00-07:45 NY: now the first
    # refresh rather than the first build.
    - cron: '7 4,5 * * *'
    # About 02:20 New York.
    - cron: '23 6,7 * * *'
    # About 04:40 New York — the slot that most often produces the morning edition.
    - cron: '41 8,9 * * *'
    # About 07:10 New York — the catch-up, for a morning the earlier slots were dropped.
    - cron: '13 11,12 * * *'
  # A free extra attempt whenever another data workflow finishes. These cost one checkout each when there
  # is nothing to do, and they are the only thing that runs the edition earlier than GitHub's own lag
  # allows: the water polo workflow lands around 09:01 UTC on a Monday. No loop is possible — the edition
  # does not trigger either of these.
  workflow_run:
    workflows: ['Water polo results', 'Stock in focus']
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        default: auto
        options: [auto, refresh, force]

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the stocks workflow, so the two never write `edition.json` at the same time. See the note
# in stocks.yml: a skipped stock slot clears the queue in about ten seconds, and the one real pick a day
# holds it for a few minutes at most. A manual backfill uses a different group and cannot block a morning.
concurrency:
  group: brooklyn-data
  cancel-in-progress: false

jobs:
  build-edition:
    # Pinned deliberately. GitHub migrates `ubuntu-latest` to Ubuntu 26 from 19 October 2026, and an
    # image change arriving on its own schedule would break the daily builds at a moment nobody chose.
    # Both runners are free for public repositories, so this costs nothing.
    runs-on: ubuntu-24.04
    # At job level, not step level: a step's own `env:` block is not visible to that step's own `if:`,
    # and the last-resort stock step has to be able to skip itself when the secrets are not configured.
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      # `actions/checkout` pins the run to the commit it was created at, not the tip of main, and a run
      # that waited in a concurrency queue starts on a commit that may be minutes old. Working from the
      # live tip instead means the pre-checks below judge what is actually published, and a push cannot
      # be rejected for being behind. See the long note in stocks.yml, where a stale checkout cost two
      # days' picks in November 2026.
      - name: Start from the live tip of main
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          git log -1 --format='working from %h %s'

      - name: Decide what to do
        id: check
        run: |
          # `inputs` is empty on a schedule or a workflow_run, so these only fire on a real dispatch.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "force" ]; then echo "action=force" >> "$GITHUB_OUTPUT"; echo "force: manual run"; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "refresh" ]; then echo "action=refresh" >> "$GITHUB_OUTPUT"; echo "refresh: manual run"; exit 0; fi
          node scripts/edition-needed.mjs

      - uses: actions/setup-node@v4
        if: steps.check.outputs.action != 'skip'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.action != 'skip'

      # The last resort for the stock card, and the reason the card should never be empty again.
      #
      # Normally the pick is decided overnight by the stocks workflow and this does nothing. But that
      # workflow is subject to the same 3.5–6 hour scheduling delay as this one, so on some mornings it
      # will not have run yet. Building the pick here means `build-edition.mjs` reads a `stock.json`
      # written moments earlier in the same job, and the ordering is correct by construction rather than
      # by luck.
      #
      # Guarded so it can never cost Paolo an edition: it is skipped when the secrets are absent, it is
      # bounded to twenty minutes, and `continue-on-error` means a failure here still produces the
      # edition — with an open-position card, and a warning in the run summary.
      - name: Decide the stock, if nothing has yet
        id: stock
        if: steps.check.outputs.action != 'skip' && env.MASSIVE_API_KEY != '' && env.SEC_CONTACT != ''
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Only `pick` is worth doing here. `patch` means the decision already exists, and
          # `build-edition.mjs` reads `stock.json` itself in the next step, so the card catches up anyway.
          if ! node scripts/stock-needed.mjs | tee /dev/stderr | grep -q '^pick'; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No decision for today yet — making one here so the card is not empty."
          node --max-old-space-size=6144 scripts/build-stocks.mjs
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Build edition
        if: steps.check.outputs.action != 'skip'
        run: |
          case "${{ steps.check.outputs.action }}" in
            force)   node scripts/build-edition.mjs --force ;;
            refresh) node scripts/build-edition.mjs --refresh ;;
            *)       node scripts/build-edition.mjs ;;
          esac

      # Say so when the card still has no pick of its own. The open-position fallback is a good card and
      # it is deliberately not alarming to look at — which is exactly why a persistent failure to decide
      # has to show up somewhere else. This is that somewhere.
      - name: Report the state of the stock card
        if: steps.check.outputs.action != 'skip'
        run: |
          kind=$(node -e "const e=require('./public/data/edition.json');console.log(e.stock?.kind??'none')")
          outcome=$(node -e "try{console.log(require('./public/data/stock.json').outcome??'unknown')}catch{console.log('nothing published')}")
          echo "stock card: $kind (feed outcome: $outcome)"
          if [ "$kind" != "pick" ]; then
            reason=$(node -e "const e=require('./public/data/edition.json');console.log(e.stock?.reason??'')")
            echo "- Stock card is \`$kind\`, not a pick. Feed outcome: \`$outcome\`. $reason" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" = "none-qualified" ]; then
              echo "::notice::No candidate qualified today. Thresholds are not relaxed to fill the card."
            else
              echo "::warning::Today's edition has no stock pick of its own (card: $kind, outcome: $outcome)."
            fi
          fi

      - name: Commit data
        id: commit
        if: steps.check.outputs.action != 'skip'
        run: |
          set -euo pipefail
          git config user.name "brooklyn-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          # `state/` always exists (the scripts create it); individual files inside may not, so add the directory.
          # `public/data/stock.json` is staged too, because the last-resort step above may have written it.
          git add public/data/edition.json public/data/editions public/data/stock.json state
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new edition."
            exit 0
          fi
          verb=$([ "${{ steps.check.outputs.action }}" = "refresh" ] && echo "Refresh" || echo "Edition")
          git commit -m "$verb $(TZ=America/New_York date +%F' '%H:%M)"
          # The only file both workflows write is `edition.json`. On a conflict the resolution is fixed
          # rather than arbitrary: keep this run's edition, because it has the newer stories, then
          # re-apply the stock card from whatever `stock.json` upstream now holds. Five attempts, then
          # the job fails loudly — a `|| true` here is how a finished edition quietly fails to ship.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=true; break; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main, keeping this run's stories"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase onto origin/main."
              exit 1
            fi
            node scripts/build-edition.mjs --stock-only
            git add public/data/edition.json public/data/editions
            git diff --cached --quiet || git commit --amend --no-edit
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not push the edition after five attempts."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-edition
    if: needs.build-edition.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
