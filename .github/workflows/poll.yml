# CWPA men's varsity national Top 20.
#
# Wednesday 6:00 p.m. New York is the primary check, because that is when the CWPA publishes.
# Thursday 6:00 a.m. is a backup that runs ONLY if Wednesday did not actually save a new poll.
#
# "Did not actually save a new poll" is narrow on purpose. `scripts/build-poll.mjs` reports success
# only when it found an article for a newer week than the published one, parsed its Top 20 table,
# validated it and wrote it. An HTTP 200, or finding last week's poll again, is not success, and the
# claim step below runs only on `saved=true`. `scripts/poll-due.mjs` reads that record on Thursday.
#
# This job never fetches scores and the score job never fetches polls, so a failure in one cannot
# take the other down.
name: CWPA poll

on:
  schedule:
    # Wednesday 18:00 New York — EDT and EST
    - cron: '0 22,23 * * 3'
    # Thursday 06:00 New York — EDT and EST
    - cron: '0 10,11 * * 4'
  # No inputs on purpose: a manual poll check always reads the CWPA now. The guard below exists
  # only to stop the Thursday cron repeating a Wednesday that already succeeded.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Is a poll check due?
        id: due
        run: |
          # Started by hand: read the CWPA now, claim no slot, and do not treat an unchanged week as
          # an awaited poll — asking again on a day when nothing new is expected is a fair thing to do.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "action=run" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "expect=false" >> "$GITHUB_OUTPUT"
            echo "run: started by hand, reading the CWPA now"
            exit 0
          fi
          echo "expect=true" >> "$GITHUB_OUTPUT"
          node scripts/poll-due.mjs

      - uses: actions/setup-node@v4
        if: steps.due.outputs.action == 'run'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.due.outputs.action == 'run'

      # A poll that is not out yet is not a failure: the script keeps the last verified table and
      # exits 0, and the screen says it is awaiting this week's poll.
      - name: Read the newest poll
        id: poll
        if: steps.due.outputs.action == 'run'
        # On the cron the guard only lets this run when a newer poll is due, so a week that turns
        # out not to exist yet is worth saying so on screen. A manual check carries no such
        # expectation, so it must not raise the "awaiting this week's poll" flag.
        run: node scripts/build-poll.mjs ${{ steps.due.outputs.expect == 'true' && '--expect-new' || '' }}

      # Any team ranked for the first time needs its crest saved once.
      - name: Fetch new logos
        if: steps.poll.outputs.saved == 'true'
        run: node scripts/fetch-logos.mjs

      # Only a run that actually saved a NEWER week counts, so the Thursday backup still fires
      # after a Wednesday run that merely found last week's poll again.
      - name: Record the week
        if: steps.poll.outputs.saved == 'true' && steps.due.outputs.slot != ''
        run: node scripts/poll-due.mjs --claim "${{ steps.due.outputs.slot }}" "${{ steps.poll.outputs.week }}"

      # `always()` on purpose: when the poll cannot be read at all, build-poll.mjs still records the
      # attempt on the last verified poll so the screen can say it is awaiting this week's. That
      # marker is worth publishing even though the job itself is about to be reported as failed.
      - name: Commit data
        id: commit
        if: always() && steps.due.outputs.action == 'run'
        run: |
          git config user.name "brooklyn-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/poll.json public/logos state
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No poll change."
          else
            git commit -m "CWPA poll $(TZ=America/New_York date +%F' '%H:%M)"
            git pull --rebase --autostash origin main || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
