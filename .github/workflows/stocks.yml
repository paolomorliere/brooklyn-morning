# Choose the day's stock, on its own schedule and off the edition's critical path.
#
# The morning edition used to do this inline: 104 requests to an undocumented Yahoo Finance endpoint,
# inside a build that has to finish before 6:00 AM New York time. That was wrong twice over. It put a
# third-party feed on the critical path of the whole edition, and a permanently broken feed produced
# green builds for weeks because nothing failed loudly. Now this workflow publishes
# `public/data/stock.json` and the edition simply reads it — and says so when what it finds is not
# today's.
#
# The schedule asks for a slot every 30 minutes from just after New York midnight through late morning —
# 26 slots. GitHub runs scheduled workflows on a best-effort basis and on this repository they have
# started 3.5–6 hours late, so asking once would be pointless, and `scripts/stock-needed.mjs` makes a
# slot with nothing to do cost one checkout (about ten seconds) instead of a full install.
#
# Why so many slots, and why so early. The pick for day T is decided on data through session T−1, so it
# can be made any time after New York midnight — hours before the edition needs it, and in the window
# where the entry rule is trivially satisfied (published before 09:30 ET means the buy is that morning's
# open, which is what the strategy intends). And if a run cannot reach a decision — a rate limit, a
# source that does not answer — it publishes `outcome: incomplete` and the next slot tries again. That
# retry is what makes "a new pick every trading day" something the system works at rather than hopes
# for. It never relaxes a threshold to get one.
#
# After publishing, this workflow patches the day's edition card itself (`--stock-only`). On 7 October
# 2026 the edition was built at 07:00 and the pick published at 07:10, and because the edition reads
# `stock.json` once the card stayed empty all day with a good pick in the file beside it. Patching
# closes that gap in seconds instead of waiting for a slot that may never come.
#
# Everything this uses is free and stays free:
#   * Massive (Polygon.io) "Stocks Basic" — no payment method, five requests a minute, and it blocks
#     rather than bills. One grouped-bars call covers every US ticker for one session.
#   * SEC — one quarterly data set per quarter, one daily index per session, and `companyfacts` only for
#     the companies the index says actually filed.
# If the free allowance is ever exhausted the run fails, nothing is published, and the edition says the
# feed stopped. No paid plan is ever activated.
name: Stock in focus

on:
  schedule:
    - cron: '10,40 4-16 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: Sessions of price history to fetch (0 = just the recent ones)
        type: string
        default: '0'
      max_companyfacts:
        description: Cap on near-end fundamentals top-ups this run
        type: string
        default: '300'
      dry_run:
        description: Compute and report without writing anything
        type: boolean
        default: false
      check_only:
        description: Just test the key with one request, then stop
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# One group shared with the morning edition, so the two never write `edition.json` at the same time:
# they queue instead of racing. A skipped slot leaves the queue in about ten seconds, and the one real
# run a day takes a few minutes — the edition waits that long at most, and only once.
#
# A manual backfill is the exception. It can run for an hour or more, and it takes its own group so it
# can never hold up a morning; it also skips the edition patch, because by the time it finishes the next
# scheduled slot will carry the pick through.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.backfill != '' && inputs.backfill != '0') && 'brooklyn-backfill' || 'brooklyn-data' }}
  cancel-in-progress: false

jobs:
  pick:
    # Pinned deliberately. GitHub migrates `ubuntu-latest` to Ubuntu 26 from 19 October 2026, and an
    # image change arriving on its own schedule would break the daily builds at a moment nobody chose.
    # Both runners are free for public repositories, so this costs nothing.
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      patched: ${{ steps.patch.outputs.patched }}
    steps:
      - uses: actions/checkout@v4

      # A scheduled run warns and stops; a run someone asked for fails. Asking for 18 red runs a day
      # until the secrets exist would teach us to ignore red, and the app already says the honest thing
      # on its own: with nothing published, the card reads "the stock build has not published anything
      # yet". The alarm belongs on the card, not in a cron nobody is watching.
      - name: Check the secrets exist
        id: secrets
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          missing=""
          [ -n "$MASSIVE_API_KEY" ] || missing="$missing MASSIVE_API_KEY"
          [ -n "$SEC_CONTACT" ] || missing="$missing SEC_CONTACT"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Stock in focus is not set up yet"
            echo ""
            echo "Missing repository secret(s):\`$missing\`. Add them under"
            echo "Settings -> Secrets and variables -> Actions:"
            echo ""
            echo "- \`MASSIVE_API_KEY\` — a free Massive (Polygon.io) \"Stocks Basic\" key. No payment"
            echo "  method; it blocks rather than bills when the free allowance is spent."
            echo "- \`SEC_CONTACT\` — a working email address. The SEC refuses automated requests that do"
            echo "  not declare a contact, and a false one would misrepresent who is asking."
            echo ""
            echo "Until then nothing is published and the card says so."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          echo "::warning::Stock in focus is not set up yet — missing$missing. Nothing published."

      # Dependency-free, so it runs before `npm ci`. Most slots stop here. Three answers:
      #   pick  – decide today's stock, then put it on the card
      #   patch – the decision is already made but the card is not showing it; fetch nothing, just patch
      #   skip  – nothing to do; this slot costs one checkout
      - name: Decide whether a pick is needed
        id: check
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=pick" >> "$GITHUB_OUTPUT"
            echo "pick: manual run"
            exit 0
          fi
          node scripts/stock-needed.mjs

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true' && steps.check.outputs.action != 'skip'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true' && steps.check.outputs.action != 'skip'

      - name: Choose the stock
        if: steps.secrets.outputs.ready == 'true' && steps.check.outputs.action == 'pick'
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        # The quarterly data sets are large, so the parse needs more heap than Node's default.
        run: |
          node --max-old-space-size=6144 scripts/build-stocks.mjs \
            ${{ inputs.check_only == true && '--check' || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            --backfill "${{ inputs.backfill || '0' }}" \
            --max-companyfacts "${{ inputs.max_companyfacts || '300' }}"

      # `always()`, because the bar cache is append-only — one small file per trading day, never
      # rewritten. A backfill that stops half way is still 300 good sessions, and the next run continues
      # from the last one cached. Throwing them away because the run ended badly would mean starting a
      # two-hour fetch from nothing every time.
      # `always()`, because the bar cache is append-only — one small file per trading day, never
      # rewritten. A backfill that stops half way is still 300 good sessions, and the next run continues
      # from the last one cached. Throwing them away because the run ended badly would mean starting a
      # two-hour fetch from nothing every time.
      - name: Commit the pick and the caches
        id: commit
        if: always() && steps.secrets.outputs.ready == 'true' && steps.check.outputs.action == 'pick' && inputs.dry_run != true && inputs.check_only != true
        run: |
          set -euo pipefail
          git config user.name "brooklyn-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          # `state/bars` is append-only: one small object per trading day, never rewritten.
          git add public/data/stock.json state
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "Stock $(TZ=America/New_York date +%F' '%H:%M)"
          # These paths have exactly one writer, so a rebase onto a newer main cannot conflict; the
          # retry is for the plain race of two pushes arriving together. Five attempts, then the job
          # fails loudly — a push that silently gave up is how a pick gets computed and then lost.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=true; break; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase --autostash origin main
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not push the pick after five attempts."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The gap this closes is the whole reason the card was empty on 7 October 2026. The pick is
      # published; the edition on disk was built before it existed. Recompute just `edition.stock` and
      # push that, leaving `preparedAt` alone so the morning refresh still sees the real story age.
      #
      # Each attempt starts from the newest main and recomputes the card from scratch, so there is never
      # a conflict to resolve — if the edition workflow pushed a whole new edition in the meantime, this
      # simply patches that one instead.
      - name: Put the pick on today's edition
        id: patch
        if: |
          steps.secrets.outputs.ready == 'true' && inputs.dry_run != true && inputs.check_only != true
          && (steps.check.outputs.action == 'patch' || (steps.check.outputs.action == 'pick' && steps.commit.outputs.changed == 'true'))
          && !(github.event_name == 'workflow_dispatch' && inputs.backfill != '' && inputs.backfill != '0')
        timeout-minutes: 5
        run: |
          set -euo pipefail
          git config user.name "brooklyn-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-edition.mjs --stock-only
            git add public/data/edition.json public/data/editions
            if git diff --cached --quiet; then
              echo "The edition card already matches the published pick."
              exit 0
            fi
            git commit -m "Stock card $(TZ=America/New_York date +%F' '%H:%M)"
            if git push; then
              echo "patched=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt); starting again from the newest main"
          done
          echo "::error::Could not patch the edition card after five attempts. The pick is published in stock.json; the card will catch up on the next edition run."
          exit 1

  deploy:
    needs: pick
    if: needs.pick.outputs.changed == 'true' || needs.pick.outputs.patched == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
