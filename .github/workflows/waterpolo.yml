# NCAA men's water polo results, 2026 season.
#
# The checking times, in New York wall-clock:
#
#   Saturday  09:00  11:30  14:00  16:30
#   Sunday    09:00  11:30  14:00  16:30  22:00
#   Monday    09:00
#
# The Sunday-night and Monday-morning checks replace the earlier rule of no weekday checks at all:
# Sunday evening games finish after the 16:30 check and some schools post a weekend result only on
# Monday morning.
#
# A run started by hand always collects. `scripts/polo-due.mjs` exists to stop the *cron* firing
# twice for one slot, and it used to gate manual runs too: the dispatch input defaulted to `auto`,
# so tapping Run workflow on a slot that had already run finished "successfully" in ten seconds
# having read nothing at all, and the app could only report that no new file had been published.
# A manual refresh now bypasses the guard entirely and claims no slot, so the automatic schedule
# below is unaffected by it.
#
# GitHub cron is UTC-only, so this asks for every one of those times under both daylight-saving
# offsets and `scripts/polo-due.mjs` turns them into exactly one real check per slot by reading the
# actual New York wall clock. That also absorbs GitHub's scheduling delay (3.5-6 h observed on this
# repository): a run that arrives late does the check for the slot it arrives in, including a
# Sunday 22:00 run that does not start until after midnight. A slot that is already done costs one
# checkout, about ten seconds.
#
# Every run reconciles all thirteen complete 2026 schedules, every opponent's season and both CWPA
# conference schedules, so Friday games, weekday games, late postings and corrections are all picked
# up by the next check and filed under their own game date.
name: Water polo results

on:
  schedule:
    # Sat/Sun 09:00, 14:00 New York — EDT and EST
    - cron: '0 13,14,18,19 * * 6,0'
    # Sat/Sun 11:30, 16:30 New York — EDT and EST
    - cron: '30 15,16,20,21 * * 6,0'
    # Sunday 22:00 New York (02:00/03:00 UTC Monday) and Monday 09:00 New York (13:00/14:00 UTC)
    - cron: '0 2,3,13,14 * * 1'
  # No inputs on purpose: there is nothing to choose, and a wrong choice used to mean a refresh
  # that silently did nothing.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One check at a time. A delayed run must never overlap the next slot's run.
concurrency:
  group: waterpolo
  cancel-in-progress: false

jobs:
  collect:
    # Pinned deliberately. GitHub migrates `ubuntu-latest` to Ubuntu 26 from 19 October 2026, and an
    # image change arriving on its own schedule would break the daily builds at a moment nobody chose.
    # Both runners are free for public repositories, so this costs nothing.
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      # `actions/checkout` pins the run to the commit it was created at, not the tip of main, and a run
      # that waited in a concurrency queue starts on a commit that may be minutes old. Working from the
      # live tip instead means the pre-checks below judge what is actually published, and a push cannot
      # be rejected for being behind. See the long note in stocks.yml, where a stale checkout cost two
      # days' picks in November 2026.
      - name: Start from the live tip of main
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          git log -1 --format='working from %h %s'

      - name: Is a check due?
        id: due
        run: |
          set -o pipefail
          # Anything that is not the cron — a manual refresh from the app — always collects.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "action=run" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "run: started by hand, reading every source now"
            exit 0
          fi
          node scripts/polo-due.mjs | tee "$RUNNER_TEMP/due.txt"
          # A slot that another run already covered ends here, green, having read nothing at all.
          # That is deliberate and costs ten seconds — but it must not look like a successful check,
          # which is the only thing a bare green tick says.
          if grep -q '^skip' "$RUNNER_TEMP/due.txt"; then
            echo "- **Nothing read.** This slot had already been checked by an earlier run; no source was contacted." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.due.outputs.action == 'run'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.due.outputs.action == 'run'

      - name: Collect results
        if: steps.due.outputs.action == 'run'
        run: node scripts/build-waterpolo.mjs

      # Any team that turned up for the first time needs its logo saved once.
      - name: Fetch new logos
        if: steps.due.outputs.action == 'run'
        run: node scripts/fetch-logos.mjs

      - name: Record the slot
        if: steps.due.outputs.action == 'run' && steps.due.outputs.slot != ''
        run: node scripts/polo-due.mjs --claim "${{ steps.due.outputs.slot }}"

      - name: Commit data
        id: commit
        if: steps.due.outputs.action == 'run'
        run: |
          set -euo pipefail
          git config user.name "brooklyn-morning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/waterpolo.json public/logos state
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Checked every source; no new results and nothing to correct."
            echo "- Checked every source successfully. **No changes**: no new results, no corrections." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Water polo results $(TZ=America/New_York date +%F' '%H:%M)"
          # This file has one writer, so each attempt simply replays it on top of the newest main —
          # a copy rather than a merge, which cannot conflict. The old version ran
          # `git pull --rebase --autostash || true` and then pushed once: a rebase that stopped on a
          # conflict was swallowed by the `|| true`, and the push then ran from inside the half-finished
          # rebase and failed with a message about the push rather than about the rebase.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=true; break; fi
            echo "push rejected (attempt $attempt); replaying onto the newest main"
            git fetch --depth=1 origin main
            keep=$(mktemp -d)
            git diff --diff-filter=d --name-only HEAD~1 HEAD | tar -czf "$keep/mine.tgz" -T -
            git reset --hard FETCH_HEAD
            tar -xzf "$keep/mine.tgz"
            rm -rf "$keep"
            git add public/data/waterpolo.json public/logos state
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "The newest main already holds this check's results."
              exit 0
            fi
            git commit -m "Water polo results $(TZ=America/New_York date +%F' '%H:%M)"
          done
          if [ "$pushed" != true ]; then
            echo "::error::Collected results but could not push them after five attempts."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "- Checked every source and **published new results**." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
